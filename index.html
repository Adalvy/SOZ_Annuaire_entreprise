<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Annuaire des entreprises</title>
<style>
  /* ==================================================================
     PALETTE DE COULEURS
     - Rouge principal : #9a2243
     - Or / doré : utilisé pour les accents et le titre
     - Fond : gris foncé (thème sombre)
     ================================================================== */
  :root {
    --rouge: #9a2243;
    --rouge-clair: #c22e56;
    --or: #d4af37;
    --or-clair: #e8ca6a;
    --bg: #1c1c1f;          /* fond général de la page */
    --bg-carte: #262629;    /* fond des cartes / de la modale */
    --bg-input: #333338;    /* fond des champs de saisie */
    --border: #3d3d42;
    --text: #eceff1;        /* texte principal (clair, sur fond sombre) */
    --text-muted: #a0a5ab;  /* texte secondaire (labels, téléphones...) */
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    padding-bottom: 60px; /* laisse de la place pour le pied de page fixe */
  }

  .page { max-width: 900px; margin: 0 auto; }

  /* ---------- En-tête de page : titre + bouton d'ajout ---------- */
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .page-header h1 {
    font-size: 22px;
    color: var(--or);
    margin: 0;
    letter-spacing: 0.02em;
  }

  /* ---------- Barre d'outils : recherche + filtre par type ---------- */
  .barre-outils {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .barre-recherche {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 220px;
    background: var(--bg-carte);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
  }
  .barre-recherche svg { flex-shrink: 0; }
  .barre-recherche input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 14px;
    padding: 4px 0;
  }
  .barre-recherche input::placeholder { color: var(--text-muted); }

  /* Contrôle "segmenté" utilisé pour le filtre par type (Tous / Privé / Public)
     et pour le choix du type dans la modale */
  .segmente {
    display: flex;
    background: var(--bg-carte);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 3px;
    gap: 3px;
  }
  .segmente button {
    border: none;
    background: transparent;
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .segmente button:hover { color: var(--text); }
  .segmente button.actif { background: var(--rouge); color: #fff; }

  /* ---------- Boutons génériques ---------- */
  .btn {
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn-primary { background: var(--rouge); color: #fff; }
  .btn-primary:hover { background: var(--rouge-clair); }
  .btn-secondary { background: var(--bg-input); color: var(--or-clair); }
  .btn-secondary:hover { background: #3d3d44; }
  .btn-danger { background: #3a1f22; color: #e08a8a; }
  .btn-danger:hover { background: #4a2529; }

  /* ---------- Liste des entreprises (cartes) ---------- */
  #liste { display: flex; flex-direction: column; gap: 14px; }

  .carte {
    background: var(--bg-carte);
    border: 1px solid var(--border);
    border-left: 3px solid var(--or); /* liseré doré distinctif à gauche */
    border-radius: 10px;
    padding: 18px 22px;
    display: flex;
    gap: 18px;
    align-items: flex-start;
  }
  .carte img.logo {
    width: 56px;
    height: 56px;
    border-radius: 8px;
    object-fit: contain;
    border: 1px solid var(--border);
    background: #fafafa; /* fond clair pour que les logos transparents ressortent */
    flex-shrink: 0;
  }
  .carte-contenu { flex: 1; min-width: 0; }
  .carte-entete {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .carte-nom {
    font-size: 17px;
    font-weight: 700;
    color: var(--or-clair);
  }
  /* Petite étiquette indiquant si l'entreprise est privée ou un service public */
  .badge-type {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
  }
  .badge-type.prive { background: rgba(154, 34, 67, 0.25); color: var(--rouge-clair); }
  .badge-type.public { background: rgba(212, 175, 55, 0.2); color: var(--or-clair); }

  .groupe-role {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--rouge-clair);
    font-weight: 700;
    margin-top: 8px;
  }
  .personne-ligne {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 2px 0;
  }
  .personne-ligne .tel { color: var(--text-muted); }
  .personne-commentaire {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    padding: 0 0 4px 0;
  }
  .carte-actions { display: flex; flex-direction: column; gap: 6px; }

  .vide { text-align: center; color: var(--text-muted); padding: 40px 0; }

  /* ==================================================================
     MODALE (fenêtre de création / édition d'une entreprise)
     ================================================================== */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.actif { display: flex; }
  .modal {
    background: var(--bg-carte);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 26px 30px;
    width: 90%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2 { margin-top: 0; font-size: 18px; color: var(--or); }

  .header-row { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
  #logoPreview {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    object-fit: contain;
    border: 1px solid var(--border);
    background: #fafafa;
    flex-shrink: 0;
  }

  label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    font-weight: 600;
  }
  input[type="text"], input[type="tel"], input[type="url"] {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    margin-top: 3px;
    color: var(--text);
  }
  input::placeholder { color: var(--text-muted); }
  /* Bordure dorée au focus, pour rester dans la charte */
  input:focus { outline: none; border-color: var(--or); }

  /* Sélecteur "Entreprise privée / Service public" dans la modale */
  .choix-type { margin-bottom: 18px; }
  .choix-type .segmente { width: 100%; }
  .choix-type .segmente button { flex: 1; }

  /* ---------- Groupes de rôles personnalisés ---------- */
  .groupe-form {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-left: 3px solid var(--rouge);
    border-radius: 8px;
    padding: 12px 14px;
    margin: 12px 0;
  }
  .groupe-form-entete {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .champ-nom-role {
    flex: 1;
    font-weight: 700;
    color: var(--or-clair);
  }
  .btn-supprimer-groupe {
    background: none;
    border: none;
    color: #e08a8a;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  .btn-ajouter-groupe {
    background: none;
    border: 1px dashed var(--rouge-clair);
    color: var(--rouge-clair);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    width: 100%;
    margin-top: 4px;
  }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 3px 4px; }
  .del-col { width: 28px; text-align: center; }
  .ligne-personne {
    border-bottom: 1px solid var(--border);
    padding: 6px 0;
  }
  .ligne-personne:last-child { border-bottom: none; }
  .ligne-personne-champs {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .ligne-personne-champs input[type="text"].champ-nom { flex: 1; }
  .ligne-personne-champs input[type="tel"].champ-tel { flex: 1; }
  .champ-commentaire {
    width: 100%;
    margin-top: 4px;
    font-size: 13px;
  }
  .btn-del { background: none; border: none; color: #e08a8a; cursor: pointer; font-size: 15px; }
  .btn-add {
    background: var(--bg-carte);
    border: 1px dashed var(--or);
    color: var(--or-clair);
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    margin: 6px 0 2px 0;
  }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  #status { font-size: 13px; margin-top: 8px; }
  #status.error { color: #e08a8a; }
  #status.ok { color: var(--or-clair); }

  /* ==================================================================
     PIED DE PAGE : toujours visible en bas de l'écran (position fixe),
     affiche la version de l'outil et le contact support.
     ================================================================== */
  .pied-de-page {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--bg-carte);
    border-top: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    z-index: 5; /* reste au-dessus du contenu, mais sous la modale (z-index 10) */
  }
  .pied-de-page .version {
    color: var(--or-clair);
    font-weight: 600;
  }
  .pied-de-page .support {
    color: var(--text-muted);
  }
  .pied-de-page .support strong {
    color: var(--text);
  }
</style>
</head>
<body>

<div class="page">

  <!-- ============================================================
       EN-TETE : titre de la page + bouton "Nouvelle entreprise"
       ============================================================ -->
  <div class="page-header">
    <h1>🏢 Annuaire des entreprises</h1>
    <button class="btn btn-primary" onclick="ouvrirModal()">+ Nouvelle entreprise</button>
  </div>

  <!-- ============================================================
       BARRE D'OUTILS :
       - recherche par nom (filtrage en direct, côté navigateur)
       - filtre par type : Tous / Entreprises privées / Services publics
       Les deux se combinent, et la liste reste triée par ordre alphabétique.
       ============================================================ -->
  <div class="barre-outils">
    <div class="barre-recherche">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a0a5ab" stroke-width="2">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="champRecherche" placeholder="Rechercher une entreprise par nom...">
    </div>

    <div class="segmente" id="filtreType">
      <button class="actif" data-valeur="Tous" onclick="changerFiltreType('Tous')">Tous</button>
      <button data-valeur="Privé" onclick="changerFiltreType('Privé')">Privées</button>
      <button data-valeur="Public" onclick="changerFiltreType('Public')">Publics</button>
    </div>
  </div>

  <!-- Conteneur où les cartes d'entreprises sont injectées dynamiquement -->
  <div id="liste">
    <div class="vide">Chargement...</div>
  </div>
</div>

<!-- ================================================================
     MODALE : formulaire d'ajout / édition d'une entreprise
     (cachée par défaut, affichée via la classe CSS "actif")
     ================================================================ -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitre">Nouvelle entreprise</h2>

    <!-- Logo (URL) + nom de l'entreprise -->
    <div class="header-row">
      <img id="logoPreview" src="https://via.placeholder.com/64?text=Logo">
      <div style="flex:1; display:flex; flex-direction:column; gap:8px;">
        <div>
          <label>URL du logo</label>
          <input type="url" id="logoUrl" placeholder="https://.../logo.png">
        </div>
        <div>
          <label>Nom de l'entreprise</label>
          <input type="text" id="nomEntreprise" placeholder="Nom de l'entreprise">
        </div>
      </div>
    </div>

    <!-- Choix du type : entreprise privée ou service public -->
    <div class="choix-type">
      <label>Type</label>
      <div class="segmente" id="choixType" style="margin-top: 4px;">
        <button class="actif" data-valeur="Privé" onclick="selectionnerType('Privé')">🏢 Entreprise privée</button>
        <button data-valeur="Public" onclick="selectionnerType('Public')">🏛️ Service public</button>
      </div>
    </div>

    <!-- Groupes de rôles personnalisés : chaque groupe a un nom libre
         (ex. "Patron(ne)s", "Adjoint(e)s", "Comptables"...) et sa liste
         de personnes (nom + téléphone). -->
    <div id="groupesRoles"></div>
    <button class="btn-ajouter-groupe" onclick="ajouterGroupe('')">+ Ajouter un rôle</button>

    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="fermerModal()">Annuler</button>
      <button class="btn btn-primary" onclick="sauvegarder()">💾 Enregistrer</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<!-- ================================================================
     PIED DE PAGE : toujours visible en bas de l'écran
     ================================================================ -->
<footer class="pied-de-page">
  <span class="version">Version 1.7</span>
  <span class="support">Support technique : <strong>Aédan Perlaut</strong> — 555-9798</span>
</footer>

<script>
  // ==================================================================
  // CONFIGURATION
  // A CONFIGURER : collez ici l'URL de votre déploiement Apps Script
  // (Déployer > Nouveau déploiement > Application Web > copier l'URL)
  // Cette URL sert d'API : le HTML lui envoie des requêtes GET (lire)
  // et POST (créer / modifier / supprimer).
  // ==================================================================
  const API_URL = 'https://script.google.com/macros/s/AKfycbwTWXDWINDFIQouXQbl70Yoyaf2ab9CUDMbXKN9UcEAriGqGkSyxca-iQujtio9m7w1cA/exec';

  // Mémorise en local la liste complète reçue du Sheet, pour pouvoir
  // filtrer/rechercher/trier instantanément sans refaire d'appel réseau.
  let toutesLesEntreprises = [];

  // Filtre de type actuellement sélectionné : 'Tous', 'Privé' ou 'Public'
  let filtreTypeActuel = 'Tous';

  // ID de l'entreprise actuellement éditée dans la modale.
  // null = on est en mode "création" plutôt qu'"édition".
  let entrepriseEnCoursId = null;

  // Type sélectionné dans la modale ('Privé' ou 'Public')
  let typeSelectionne = 'Privé';

  // Compteur utilisé pour donner un identifiant unique à chaque groupe de rôle créé
  let compteurGroupe = 0;

  // ------------------------------------------------------------------
  // CHARGEMENT DES DONNEES depuis l'API (Google Sheet)
  // ------------------------------------------------------------------

  // Va chercher la liste des entreprises sur l'API, puis l'affiche.
  async function chargerEntreprises() {
    const liste = document.getElementById('liste');
    liste.innerHTML = '<div class="vide">Chargement...</div>';
    try {
      const res = await fetch(API_URL); // requête GET simple
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Erreur inconnue');

      toutesLesEntreprises = data.entreprises || [];
      appliquerTriEtFiltre(); // trie + filtre + affiche
    } catch (err) {
      liste.innerHTML = '<div class="vide">Erreur de chargement : ' + escapeHtml(err.message) + '</div>';
    }
  }

  // ------------------------------------------------------------------
  // TRI ALPHABETIQUE + RECHERCHE + FILTRE PAR TYPE
  // ------------------------------------------------------------------

  // Change le filtre de type actif (Tous / Privé / Public), met à jour
  // le style des boutons, puis réaffiche la liste en conséquence.
  function changerFiltreType(valeur) {
    filtreTypeActuel = valeur;
    document.querySelectorAll('#filtreType button').forEach(function (btn) {
      btn.classList.toggle('actif', btn.dataset.valeur === valeur);
    });
    appliquerTriEtFiltre();
  }

  // Trie les entreprises par nom (A -> Z, insensible aux accents/majuscules),
  // applique le filtre de recherche texte, puis le filtre de type, et affiche.
  function appliquerTriEtFiltre() {
    const terme = document.getElementById('champRecherche').value.trim().toLowerCase();

    // 1) Tri alphabétique par nom d'entreprise
    let resultat = [...toutesLesEntreprises].sort(function (a, b) {
      return (a.nom || '').localeCompare(b.nom || '', 'fr', { sensitivity: 'base' });
    });

    // 2) Filtre texte sur le nom
    if (terme) {
      resultat = resultat.filter(function (ent) { return (ent.nom || '').toLowerCase().includes(terme); });
    }

    // 3) Filtre par type (Privé / Public), sauf si "Tous" est sélectionné
    if (filtreTypeActuel !== 'Tous') {
      resultat = resultat.filter(function (ent) { return (ent.type || 'Privé') === filtreTypeActuel; });
    }

    afficherListe(resultat);
  }

  // Relance le tri/filtre à chaque frappe dans la barre de recherche
  document.getElementById('champRecherche').addEventListener('input', appliquerTriEtFiltre);

  // ------------------------------------------------------------------
  // AFFICHAGE DE LA LISTE (construction des cartes HTML)
  // ------------------------------------------------------------------

  function afficherListe(entreprises) {
    const liste = document.getElementById('liste');
    liste.innerHTML = '';

    if (!entreprises || entreprises.length === 0) {
      liste.innerHTML = '<div class="vide">Aucune entreprise trouvée.</div>';
      return;
    }

    entreprises.forEach(function (ent) {
      const type = ent.type || 'Privé';
      const classeBadge = type === 'Public' ? 'public' : 'prive';
      const texteBadge = type === 'Public' ? 'Service public' : 'Privée';

      const carte = document.createElement('div');
      carte.className = 'carte';
      // NOTE : on n'utilise plus onclick="..." avec les données de l'entreprise
      // injectées directement dans le HTML (via JSON.stringify), car un nom,
      // un commentaire ou une URL contenant une apostrophe ou un guillemet
      // cassait silencieusement l'attribut HTML et rendait le bouton inactif.
      // A la place, on stocke juste l'ID (data-id) et on va rechercher les
      // données correspondantes dans toutesLesEntreprises au moment du clic.
      carte.innerHTML =
        '<img class="logo" src="' + (ent.logo || 'https://via.placeholder.com/56?text=Logo') + '">' +
        '<div class="carte-contenu">' +
          '<div class="carte-entete">' +
            '<div class="carte-nom">' + escapeHtml(ent.nom || '(Sans nom)') + '</div>' +
            '<span class="badge-type ' + classeBadge + '">' + texteBadge + '</span>' +
          '</div>' +
          renderGroupesPourAffichage(ent.personnes) +
        '</div>' +
        '<div class="carte-actions">' +
          '<button class="btn btn-secondary btn-modifier" data-id="' + ent.id + '">Modifier</button>' +
          '<button class="btn btn-danger btn-supprimer" data-id="' + ent.id + '">Supprimer</button>' +
        '</div>';
      liste.appendChild(carte);
    });

    // Attache les clics sur "Modifier" : on recherche l'entreprise complète
    // par son ID dans la liste en mémoire, puis on ouvre la modale avec.
    document.querySelectorAll('.btn-modifier').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const ent = toutesLesEntreprises.find(function (e) { return e.id === btn.dataset.id; });
        if (ent) ouvrirModal(ent);
      });
    });

    // Attache les clics sur "Supprimer"
    document.querySelectorAll('.btn-supprimer').forEach(function (btn) {
      btn.addEventListener('click', function () {
        supprimerEntreprise(btn.dataset.id);
      });
    });
  }

  // Regroupe la liste de personnes par rôle (peu importe le nom du rôle),
  // en conservant l'ordre dans lequel les rôles apparaissent, puis construit
  // le HTML d'affichage groupe par groupe.
  function renderGroupesPourAffichage(personnes) {
    const rolesOrdonnes = [];        // ordre d'apparition des rôles
    const personnesParRole = {};     // role -> tableau de personnes

    (personnes || []).forEach(function (p) {
      const role = p.role || 'Autre';
      if (!personnesParRole[role]) {
        personnesParRole[role] = [];
        rolesOrdonnes.push(role);
      }
      personnesParRole[role].push(p);
    });

    let html = '';
    rolesOrdonnes.forEach(function (role) {
      html += '<div class="groupe-role">' + escapeHtml(role) + '</div>';
      personnesParRole[role].forEach(function (p) {
        html += '<div class="personne-ligne"><span>' + escapeHtml(p.nom) + '</span><span class="tel">' + escapeHtml(p.telephone) + '</span></div>';
        if (p.commentaire) {
          html += '<div class="personne-commentaire">💬 ' + escapeHtml(p.commentaire) + '</div>';
        }
      });
    });
    return html;
  }

  // ------------------------------------------------------------------
  // MODALE : ouverture / fermeture / remplissage du formulaire
  // ------------------------------------------------------------------

  // Ouvre la modale. Si "entreprise" est fourni, on est en mode édition
  // (les champs sont pré-remplis) ; sinon, formulaire vide (création).
  function ouvrirModal(entreprise) {
    document.getElementById('overlay').classList.add('actif');
    document.getElementById('status').textContent = '';
    document.getElementById('groupesRoles').innerHTML = '';

    if (entreprise) {
      entrepriseEnCoursId = entreprise.id;
      document.getElementById('modalTitre').textContent = "Modifier l'entreprise";
      document.getElementById('logoUrl').value = entreprise.logo || '';
      document.getElementById('nomEntreprise').value = entreprise.nom || '';
      selectionnerType(entreprise.type || 'Privé');

      // Reconstruit les groupes de rôles à partir des personnes existantes,
      // en conservant l'ordre d'apparition des rôles.
      const rolesOrdonnes = [];
      const personnesParRole = {};
      (entreprise.personnes || []).forEach(function (p) {
        const role = p.role || '';
        if (!personnesParRole[role]) {
          personnesParRole[role] = [];
          rolesOrdonnes.push(role);
        }
        personnesParRole[role].push(p);
      });
      rolesOrdonnes.forEach(function (role) {
        ajouterGroupe(role, personnesParRole[role]);
      });
    } else {
      entrepriseEnCoursId = null;
      document.getElementById('modalTitre').textContent = 'Nouvelle entreprise';
      document.getElementById('logoUrl').value = '';
      document.getElementById('nomEntreprise').value = '';
      selectionnerType('Privé');

      // Deux groupes par défaut pour rester pratique, mais entièrement
      // renommables ou supprimables par l'utilisateur.
      ajouterGroupe('Patron');
      ajouterGroupe('Adjoint');
    }
    mettreAJourApercuLogo();
  }

  function fermerModal() {
    document.getElementById('overlay').classList.remove('actif');
  }

  // Met à jour la miniature du logo affichée dans la modale
  // à chaque fois que l'utilisateur modifie l'URL du logo.
  function mettreAJourApercuLogo() {
    const url = document.getElementById('logoUrl').value.trim();
    document.getElementById('logoPreview').src = url || 'https://via.placeholder.com/64?text=Logo';
  }
  document.getElementById('logoUrl').addEventListener('input', mettreAJourApercuLogo);

  // Sélectionne le type d'entreprise (Privé / Public) dans la modale
  // et met à jour visuellement le bouton actif.
  function selectionnerType(valeur) {
    typeSelectionne = valeur;
    document.querySelectorAll('#choixType button').forEach(function (btn) {
      btn.classList.toggle('actif', btn.dataset.valeur === valeur);
    });
  }

  // ------------------------------------------------------------------
  // GROUPES DE ROLES PERSONNALISES (création, ajout/suppression de lignes)
  // ------------------------------------------------------------------

  // Ajoute un nouveau bloc "groupe de rôle" dans la modale, avec :
  // - un champ texte pour nommer le rôle (ex. "Patron", "RH"...)
  // - un tableau de personnes (nom + téléphone) rattachées à ce rôle
  // - un bouton pour supprimer entièrement le groupe
  function ajouterGroupe(nomRole, personnes) {
    compteurGroupe++;
    const idGroupe = 'groupe_' + compteurGroupe;

    const div = document.createElement('div');
    div.className = 'groupe-form';
    div.id = idGroupe;
    div.innerHTML =
      '<div class="groupe-form-entete">' +
        '<input type="text" class="champ-nom-role" placeholder="Nom du rôle (ex: Patron, Comptable...)" value="' + escapeHtml(nomRole || '') + '">' +
        '<button class="btn-supprimer-groupe" onclick="document.getElementById(\'' + idGroupe + '\').remove()">🗑 Supprimer ce rôle</button>' +
      '</div>' +
      '<div class="liste-personnes"></div>' +
      '<button class="btn-add" onclick="ajouterLigneDansGroupe(\'' + idGroupe + '\')">+ Ajouter une personne</button>';

    document.getElementById('groupesRoles').appendChild(div);

    // Pré-remplit les personnes déjà existantes pour ce rôle (mode édition)
    (personnes || []).forEach(function (p) {
      ajouterLigneDansGroupe(idGroupe, p.nom, p.telephone, p.commentaire);
    });
  }

  // Ajoute une ligne (nom + téléphone + commentaire) pour une personne, dans
  // le groupe de rôle donné. Si la ligne est toute nouvelle (bouton
  // "+ Ajouter une personne", aucun argument passé), le téléphone est
  // préempli avec "555-" par défaut. Si on recharge une personne déjà
  // existante (mode édition), on garde ses vraies valeurs telles quelles,
  // même si elles sont vides.
  function ajouterLigneDansGroupe(idGroupe, nom, telephone, commentaire) {
    const estNouvelleLigneVide = (nom === undefined && telephone === undefined);
    nom = nom || '';
    telephone = telephone !== undefined ? telephone : (estNouvelleLigneVide ? '555-' : '');
    commentaire = commentaire || '';

    const conteneur = document.querySelector('#' + idGroupe + ' .liste-personnes');
    const div = document.createElement('div');
    div.className = 'ligne-personne';
    div.innerHTML =
      '<div class="ligne-personne-champs">' +
        '<input type="text" class="champ-nom" value="' + escapeHtml(nom) + '" placeholder="Nom">' +
        '<input type="tel" class="champ-tel" value="' + escapeHtml(telephone) + '" placeholder="Téléphone">' +
        '<div class="del-col"><button class="btn-del" onclick="this.closest(\'.ligne-personne\').remove()">✕</button></div>' +
      '</div>' +
      '<input type="text" class="champ-commentaire" value="' + escapeHtml(commentaire) + '" placeholder="Commentaire (optionnel)">';
    conteneur.appendChild(div);
  }

  // Echappe le texte pour éviter les injections HTML (sécurité basique)
  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : str;
    return div.innerHTML;
  }

  // Parcourt tous les groupes de rôles affichés dans la modale et construit
  // la liste "personnes" (avec leur rôle et commentaire) à envoyer à l'API.
  function collecterPersonnes() {
    const personnes = [];
    document.querySelectorAll('.groupe-form').forEach(function (groupe) {
      const nomRole = groupe.querySelector('.champ-nom-role').value.trim() || 'Autre';
      groupe.querySelectorAll('.ligne-personne').forEach(function (ligne) {
        const nom = ligne.querySelector('.champ-nom').value.trim();
        const telephone = ligne.querySelector('.champ-tel').value.trim();
        const commentaire = ligne.querySelector('.champ-commentaire').value.trim();
        if (nom || telephone || commentaire) {
          personnes.push({ role: nomRole, nom: nom, telephone: telephone, commentaire: commentaire });
        }
      });
    });
    return personnes;
  }

  // ------------------------------------------------------------------
  // SAUVEGARDE / SUPPRESSION (appels API vers le Google Sheet)
  // ------------------------------------------------------------------

  // Envoie la création/modification d'une entreprise à l'API,
  // puis rafraîchit la liste affichée.
  async function sauvegarder() {
    const statusEl = document.getElementById('status');
    statusEl.className = '';
    statusEl.textContent = 'Enregistrement...';

    const entreprise = {
      id: entrepriseEnCoursId, // null si nouvelle entreprise
      nom: document.getElementById('nomEntreprise').value.trim(),
      logo: document.getElementById('logoUrl').value.trim(),
      type: typeSelectionne, // 'Privé' ou 'Public'
      personnes: collecterPersonnes()
    };

    try {
      // Astuce : on ne met pas de header "Content-Type: application/json"
      // pour éviter le "preflight" CORS, qu'Apps Script ne gère pas.
      // Le corps envoyé reste néanmoins du JSON valide.
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save', entreprise: entreprise })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Erreur inconnue');

      statusEl.className = 'ok';
      statusEl.textContent = '✓ Enregistré';
      await chargerEntreprises(); // on recharge pour être synchro avec le Sheet
      setTimeout(fermerModal, 500);
    } catch (err) {
      statusEl.className = 'error';
      statusEl.textContent = 'Erreur : ' + err.message;
    }
  }

  // Demande confirmation puis supprime une entreprise (et son personnel) via l'API
  async function supprimerEntreprise(id) {
    if (!confirm('Supprimer cette entreprise et tout son personnel ?')) return;
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id: id })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Erreur inconnue');
      await chargerEntreprises();
    } catch (err) {
      alert('Erreur lors de la suppression : ' + err.message);
    }
  }

  // ------------------------------------------------------------------
  // DEMARRAGE : on charge la liste dès l'ouverture de la page
  // ------------------------------------------------------------------
  chargerEntreprises();
</script>

</body>
</html>
